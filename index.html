        let dbData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultData;
        if (!Array.isArray(dbData.lkpd)) dbData.lkpd = []; // migrasi data lama agar menu LKPD tetap aman
        function saveDB() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dbData));
        }

        // ===== Hash password (SHA-256, disalt dengan username) =====
        function sha256(str) {
            const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
            const bytes = Array.from(new TextEncoder().encode(str));
            const bitLen = bytes.length * 8;
            bytes.push(0x80);
            while (bytes.length % 64 !== 56) bytes.push(0);
            for (let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (bitLen >>> (i * 8)) & 0xff);
            let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
            const rotr = (x, n) => (x >>> n) | (x << (32 - n));
            for (let off = 0; off < bytes.length; off += 64) {
                const w = new Array(64);
                for (let i = 0; i < 16; i++) w[i] = (bytes[off+i*4] << 24) | (bytes[off+i*4+1] << 16) | (bytes[off+i*4+2] << 8) | bytes[off+i*4+3];
                for (let i = 16; i < 64; i++) {
                    const s0 = rotr(w[i-15],7) ^ rotr(w[i-15],18) ^ (w[i-15] >>> 3);
                    const s1 = rotr(w[i-2],17) ^ rotr(w[i-2],19) ^ (w[i-2] >>> 10);
                    w[i] = (w[i-16] + s0 + w[i-7] + s1) | 0;
                }
                let [a,b,c,d,e,f,g,h] = H;
                for (let i = 0; i < 64; i++) {
                    const S1 = rotr(e,6) ^ rotr(e,11) ^ rotr(e,25);
                    const ch = (e & f) ^ (~e & g);
                    const t1 = (h + S1 + ch + K[i] + w[i]) | 0;
                    const S0 = rotr(a,2) ^ rotr(a,13) ^ rotr(a,22);
                    const maj = (a & b) ^ (a & c) ^ (b & c);
                    const t2 = (S0 + maj) | 0;
                    h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
                }
                H = [(H[0]+a)|0,(H[1]+b)|0,(H[2]+c)|0,(H[3]+d)|0,(H[4]+e)|0,(H[5]+f)|0,(H[6]+g)|0,(H[7]+h)|0];
            }
            return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
        }
        const HASH_PREFIX = 'sha256$';
        function hashPassword(username, plain) { return HASH_PREFIX + sha256(username + ':' + plain); }
        function verifyPassword(user, plain) {
            // Mendukung password lama (teks biasa) maupun yang sudah di-hash
            if (typeof user.password === 'string' && user.password.startsWith(HASH_PREFIX)) {
                return user.password === hashPassword(user.username, plain);
            }
            return user.password === plain;
        }
        // Mengambil password yang bisa ditampilkan admin (teks asli bila tersedia)
        function getDisplayPassword(user) {
            if (!user) return null;
            if (user.plainPassword) return user.plainPassword;
            if (typeof user.password === 'string' && !user.password.startsWith(HASH_PREFIX)) return user.password;
            return null; // hanya hash tersimpan, teks asli tidak diketahui
        }
        function renderPasswordText(user) {
            const pw = getDisplayPassword(user);
            if (!pw) return '<em class="text-amberBrown-700 font-normal">Tidak tersedia (sudah di-hash)</em>';
            return String(pw).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        let currentUser = null;
        let currentRole = null;
        let activeTab = 'dashboard';
        let isMobileMenuOpen = false;

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-xl text-xs sm:text-sm font-medium flex items-center gap-3 transition-all duration-300 transform translate-y-2 opacity-0 ${
                type === 'success' ? 'bg-amberBrown-800 text-cream-50 border border-amber-600/30' : 'bg-red-800 text-white'
            }`;
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-amber-300' : 'fa-circle-exclamation'}"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2', 'opacity-0'); }, 50);
            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function renderLogin() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="flex-grow flex items-center justify-center p-4 sm:p-6 bg-gradient-to-br from-cream-100 via-cream-50 to-cream-200 overflow-y-auto">
                    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl border border-cream-200 overflow-hidden p-6 sm:p-8 my-auto">
                        <div class="text-center mb-6 sm:mb-8">
                            <img src="logo-bimbel.png" alt="Logo Bimbel Askara" class="h-28 w-auto mx-auto mb-3 object-contain">
                            <h1 class="text-2xl font-bold text-chocolate-900 tracking-tight">Bimbel Askara</h1>
                            <p class="text-xs sm:text-sm text-amberBrown-700 mt-1">Multi-Device Portal Akademik (Android, iOS, Windows, Mac)</p>
                        </div>

                        <form onsubmit="handleLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-amberBrown-700 mb-1.5">Username</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-amberBrown-600"><i class="fa-solid fa-user"></i></span>
                                    <input type="text" id="login-username" required class="w-full pl-10 pr-4 py-3.5 bg-cream-50 border border-cream-300 rounded-xl focus:outline-none focus:border-amberBrown-600 text-sm" placeholder="Username...">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold uppercase tracking-wider text-amberBrown-700 mb-1.5">Password</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-amberBrown-600"><i class="fa-solid fa-lock"></i></span>
                                    <input type="password" id="login-password" required class="w-full pl-10 pr-4 py-3.5 bg-cream-50 border border-cream-300 rounded-xl focus:outline-none focus:border-amberBrown-600 text-sm" placeholder="Password...">
                                </div>
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-amberBrown-800 text-cream-50 rounded-xl font-semibold hover:bg-amberBrown-900 transition-all shadow-md text-sm mt-2">
                                Login
                            </button>
                        </form>

                    </div>
                </div>
            `;
        }

        // ===== Konfigurasi login =====
        // Kosongkan untuk login lokal (localStorage). Isi dengan URL backend, contoh: 'https://api-anda.onrender.com'
        const API_URL = '';

        async function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('login-username').value.trim();
            const p = document.getElementById('login-password').value.trim();
            let found = null;

            if (API_URL) {
                // Login lewat backend (Neon Postgres): role dideteksi otomatis dari database
                try {
                    const res = await fetch(API_URL + '/api/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: u, password: p })
                    });
                    const data = await res.json();
                    if (!res.ok) { showToast(data.error || 'Username atau Password salah!', 'error'); return; }
                    found = data.user;
                } catch (err) {
                    showToast('Tidak dapat terhubung ke server.', 'error');
                    return;
                }
            } else {
                // Login lokal: role dideteksi otomatis dari data akun
                found = dbData.users.find(x => x.username === u && verifyPassword(x, p));
                if (found && !String(found.password).startsWith(HASH_PREFIX)) {
                    found.plainPassword = found.plainPassword || p;
                    found.password = hashPassword(found.username, p);
                    saveDB();
                }
            }

            if (found) {
                currentUser = found;
                currentRole = found.role; // admin / siswa / ortu

        function handleTambahAnggota(e) {
            e.preventDefault();
            const role = document.getElementById('new-role').value;
            const username = document.getElementById('new-username').value.trim();
            const password = document.getElementById('new-password').value.trim();
            const name = document.getElementById('new-name').value.trim();

            if (dbData.users.some(u => u.username === username)) {
                showToast('Username sudah terdaftar!', 'error');
                return;
            }

            // Validasi: password siswa dan password orang tua tidak boleh sama
            if (role === 'siswa') {
                const parentPassword = document.getElementById('new-parent-password').value.trim();
                if (!parentPassword) { showToast('Password orang tua wajib diisi!', 'error'); return; }
                if (password === parentPassword) {
                    showToast('Password siswa dan password orang tua tidak boleh sama!', 'error');
                    return;
                }
            } else {
                const linkedStudent = dbData.users.find(u => u.username === document.getElementById('new-student-username').value);
                if (linkedStudent && verifyPassword(linkedStudent, password)) {
                    showToast('Password orang tua tidak boleh sama dengan password siswa yang dipantau!', 'error');
                    return;
                }
            }

            let newUser = { id: 'u_' + Date.now(), role, username, password: hashPassword(username, password), plainPassword: password, name };
            if (role === 'siswa') {
                newUser.parentName = document.getElementById('new-parent-name').value.trim();
                newUser.parentUsername = document.getElementById('new-parent-username').value.trim();
                newUser.pob = document.getElementById('new-pob').value.trim();
                newUser.dob = document.getElementById('new-dob').value;
                newUser.school = document.getElementById('new-school').value.trim();
                newUser.grade = document.getElementById('new-grade').value.trim();
                newUser.address = document.getElementById('new-address').value.trim();
                newUser.phone = document.getElementById('new-phone').value.trim();
                newUser.parentPhone = document.getElementById('new-parent-phone').value.trim();
                newUser.bank = document.getElementById('new-bank').value.trim() || '-';
                
                if (!dbData.users.some(u => u.username === newUser.parentUsername)) {
                    dbData.users.push({
                        id: 'u_' + (Date.now() + 1),
                        role: 'ortu',
                        username: newUser.parentUsername,
                        password: hashPassword(newUser.parentUsername, document.getElementById('new-parent-password').value.trim()),
                        plainPassword: document.getElementById('new-parent-password').value.trim(),
                        name: newUser.parentName,
                        studentUsername: newUser.username,
                        studentName: newUser.name,
                        address: newUser.address,
                        phone: newUser.parentPhone,
                        bank: newUser.bank
                    });
                }
            } else {
                newUser.studentUsername = document.getElementById('new-student-username').value;
                const stud = dbData.users.find(u => u.username === newUser.studentUsername);
                newUser.studentName = stud ? stud.name : '-';
                newUser.address = document.getElementById('new-address').value.trim();
                newUser.phone = document.getElementById('new-phone').value.trim();
                newUser.bank = document.getElementById('new-bank').value.trim();
            }

            dbData.users.push(newUser);
            saveDB();
            showToast(`Berhasil mendaftarkan ${role} (${name}) dan tersinkron ke sistem!`);
            setActiveTab('daftar-siswa');
        }

                                    <div class="flex items-center justify-between">
                                        <span class="text-xs font-semibold text-amberBrown-700 block">Periode</span>
                                        <span class="px-2.5 py-0.5 rounded-md text-[10px] font-bold ${p.status === 'Lunas' ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">${p.status}</span>
                                    </div>
                                    <h3 class="font-bold text-chocolate-900 text-base mt-0.5">${p.month}</h3>
                                </div>

                                <div class="p-3 bg-cream-50 rounded-2xl border border-cream-200 text-xs space-y-1">
                                    ${p.status === 'Lunas' ? `
                                        <p><strong>Metode:</strong> <span class="uppercase font-semibold text-amberBrown-800">${p.method || 'Online'}</span></p>
                                        <p><strong>Bank/Info:</strong> ${p.bankName || '-'}</p>
                                        <p class="text-[10px] text-amberBrown-600">Waktu: ${p.payTime || '-'} (${p.payDate || '-'})</p>
                                    ` : `
                                        <p class="text-amberBrown-700 italic">Belum melakukan pembayaran SPP.</p>
                                    `}
                                </div>

                                ${p.status === 'Belum Lunas' ? `
                                    <button onclick="openOrtuPayModal('${p.id}')" class="w-full py-2.5 bg-amberBrown-800 hover:bg-amberBrown-900 text-cream-50 rounded-xl font-semibold text-xs shadow transition-all">
                                        <i class="fa-solid fa-qrcode mr-1.5"></i> Bayar Online (QRIS / TF)
                                    </button>
                                ` : `
                                    <div class="text-center text-[10px] font-semibold text-emerald-700 flex items-center justify-center gap-1">
                                        <i class="fa-solid fa-circle-check"></i> Pembayaran Terverifikasi
                                    </div>
                                `}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openOrtuPayModal(paymentId) {
            const pay = dbData.payments.find(p => p.id === paymentId);
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="bg-white w-full max-w-md rounded-3xl p-6 border border-cream-200 shadow-xl space-y-4">
                    <div class="flex items-center justify-between pb-3 border-b border-cream-200">
                        <h3 class="text-lg font-bold text-chocolate-900">Pembayaran Online SPP</h3>
                        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-cream-100 flex items-center justify-center text-amberBrown-900"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="p-4 bg-cream-50 rounded-2xl border border-cream-200 text-xs space-y-1">
                        <p><strong>Periode:</strong> ${pay.month}</p>
                        <p><strong>Jumlah Tagihan:</strong> Rp 350.000</p>
                    </div>

                    <div class="space-y-3">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-amberBrown-700">Pilih Metode Pembayaran Online</label>
                        <div class="grid grid-cols-2 gap-3">
                            <button onclick="submitOrtuPayment('${pay.id}', 'QRIS')" class="p-4 bg-cream-50 hover:bg-cream-100 border border-cream-300 rounded-2xl text-center transition-all group">
                                <i class="fa-solid fa-qrcode text-amberBrown-800 text-xl mb-1.5 group-hover:scale-110 transition-transform"></i>
                                <span class="block font-bold text-xs text-chocolate-900">QRIS</span>
                                <span class="text-[10px] text-amberBrown-700">Scan & Bayar Instan</span>
                            </button>
                            <button onclick="submitOrtuPayment('${pay.id}', 'Transfer Bank')" class="p-4 bg-cream-50 hover:bg-cream-100 border border-cream-300 rounded-2xl text-center transition-all group">
                                <i class="fa-solid fa-building-columns text-amberBrown-800 text-xl mb-1.5 group-hover:scale-110 transition-transform"></i>
                                <span class="block font-bold text-xs text-chocolate-900">Transfer Bank</span>
                                <span class="text-[10px] text-amberBrown-700">BCA / Mandiri / BSI</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            container.classList.remove('hidden'); container.classList.add('flex');
        }

        function submitOrtuPayment(paymentId, method) {
            const pay = dbData.payments.find(p => p.id === paymentId);
            if (pay) {
                pay.status = 'Lunas';
                pay.method = 'Online';
                pay.bankName = method === 'QRIS' ? 'QRIS Auto-Gateway' : 'Transfer Bank Virtual Account';
                pay.payTime = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }) + ' WIB';
                pay.payDate = new Date().toISOString().split('T')[0];
                saveDB();
                closeModal();
                showToast(`Pembayaran online via ${method} berhasil dan tercatat lunas!`);
                renderDashboard();
            }
        }

        function renderOrtuDiskusi() {
            const student = getConnectedStudent();
            const myDiscussions = dbData.discussions.filter(d => d.parentUsername === currentUser.username);
            return `
                <div class="space-y-6">
                    <div class="bg-white p-6 rounded-3xl border border-cream-200 shadow-sm flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div>
                            <h2 class="text-lg sm:text-xl font-bold text-chocolate-900">Diskusi & Tanya Jawab dengan Admin</h2>
                            <p class="text-xs text-amberBrown-700">Ajukan pertanyaan terkait perkembangan anak (${student.name}).</p>
                        </div>
                        <button onclick="openAskQuestionModal()" class="px-4 py-2.5 bg-amberBrown-800 text-cream-50 rounded-xl font-semibold text-xs hover:bg-amberBrown-900 shadow">
                            <i class="fa-solid fa-plus mr-2"></i> Tanya Baru
                        </button>
                    </div>

                    <div class="space-y-4">
                        ${myDiscussions.length === 0 ? '<div class="bg-white p-8 rounded-3xl text-center text-amberBrown-700">Belum ada diskusi.</div>' : myDiscussions.map(d => `
                            <div class="bg-white p-6 rounded-3xl border border-cream-200 shadow-sm space-y-4">
                                <div class="flex items-center justify-between text-xs pb-3 border-b border-cream-200">
                                    <span class="font-bold text-chocolate-900">${d.date}</span>
                                    <span class="text-amberBrown-700">Anak: ${student.name}</span>
                                </div>
                                <p class="text-xs text-chocolate-900 bg-cream-50 p-4 rounded-2xl border border-cream-200"><strong>Pertanyaan Anda:</strong> ${d.question}</p>
                                
                                <div class="p-4 bg-amberBrown-800 text-cream-50 rounded-2xl text-xs space-y-1">
                                    <span class="font-bold text-amber-200 uppercase tracking-wider text-[10px] block">Balasan Admin Askara</span>
                                    <p>${d.answer || '<span class="italic text-cream-200">Menunggu jawaban admin...</span>'}</p>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function openAskQuestionModal() {
            const student = getConnectedStudent();
            const container = document.getElementById('modal-container');
            container.innerHTML = `
                <div class="bg-white w-full max-w-md rounded-3xl p-6 border border-cream-200 shadow-xl">
                    <h3 class="text-lg font-bold text-chocolate-900 mb-1">Ajukan Pertanyaan ke Admin</h3>
                    <p class="text-xs text-amberBrown-700 mb-4">Siswa: ${student.name}</p>
                    <form onsubmit="submitAskQuestion(event)" class="space-y-4">
                        <div>
                            <label class="block text-xs font-semibold uppercase tracking-wider text-amberBrown-700 mb-1">Pesan / Pertanyaan</label>
                            <textarea id="modal-question-text" required rows="4" class="w-full px-4 py-3 bg-cream-50 border border-cream-300 rounded-xl text-sm" placeholder="Tuliskan pertanyaan..."></textarea>
                        </div>
                        <div class="flex justify-end gap-3 pt-2">
                            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-cream-100 rounded-xl text-xs font-semibold">Batal</button>
                            <button type="submit" class="px-4 py-2 bg-amberBrown-800 text-cream-50 rounded-xl text-xs font-semibold">Kirim</button>
                        </div>
                    </form>
                </div>
            `;
            container.classList.remove('hidden'); container.classList.add('flex');
        }

        function submitAskQuestion(e) {
            e.preventDefault();
            const student = getConnectedStudent();
            const question = document.getElementById('modal-question-text').value.trim();
            dbData.discussions.push({
                id: 'd_' + Date.now(),
                studentUsername: student.username,
                parentUsername: currentUser.username,
                parentName: currentUser.name,
                question,
                answer: 'Menunggu balasan admin...',
                date: new Date().toISOString().split('T')[0]
            });
            saveDB(); closeModal(); showToast('Pertanyaan dikirim ke Admin.'); renderDashboard();
        }

        function renderOrtuProfil() {
            const o = currentUser;
            const student = getConnectedStudent();
            return `
                <div class="max-w-2xl mx-auto bg-white p-6 sm:p-8 rounded-3xl border border-cream-200 shadow-sm space-y-6">
                    <div class="flex items-center gap-4 pb-6 border-b border-cream-200">
                        <div class="w-16 h-16 rounded-2xl bg-amberBrown-800 text-cream-50 flex items-center justify-center font-bold text-2xl shadow">
                            ${o.name.charAt(0)}
                        </div>
                        <div>
                            <h2 class="text-lg sm:text-xl font-bold text-chocolate-900">${o.name}</h2>
                            <span class="text-xs font-semibold px-2.5 py-1 bg-cream-100 text-amberBrown-800 rounded-lg">Orang Tua / Wali</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                        <div class="p-4 bg-cream-50 rounded-2xl border border-cream-200">
                            <span class="text-amberBrown-700 block font-semibold mb-1">Siswa yang Dipantau</span>
                            <strong class="text-chocolate-900 text-sm">${student.name}</strong>
                        </div>
                        <div class="p-4 bg-cream-50 rounded-2xl border border-cream-200">
                            <span class="text-amberBrown-700 block font-semibold mb-1">Rekening Bank</span>
                            <strong class="text-chocolate-900 text-sm">${o.bank || '-'}</strong>
                        </div>
                    </div>

                    <div class="p-4 bg-cream-50 rounded-2xl border border-cream-200 text-xs">
                        <span class="text-amberBrown-700 block font-semibold mb-1">Alamat</span>
                        <p class="text-chocolate-900 font-medium">${o.address || '-'}</p>
                    </div>

                    <div class="p-4 bg-cream-50 rounded-2xl border border-cream-200 text-xs">
                        <span class="text-amberBrown-700 block font-semibold mb-1">Nomor Telepon</span>
                        <strong class="text-chocolate-900 text-sm">${o.phone || '-'}</strong>
                    </div>
                </div>
            `;
        }

        window.onload = function() {
            renderLogin();
        }
    </script>
</body>
</html>
